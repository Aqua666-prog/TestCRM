services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U crm -d crm']
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/crm
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 5
  proxy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
